<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pricing - Virunga Digital Solutions</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f4f7fb;
}

/* HEADER */
header{
    background:#0a3d62;
    padding:20px;
    color:white;
    text-align:center;
}

/* PRICING SECTION */
.pricing-section{
    padding:60px 10%;
    text-align:center;
}

h2{
    color:orange;
    margin-bottom:30px;
}

/* TABLE STYLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#0a3d62;
    color:white;
    padding:15px;
    font-size:16px;
}

td{
    padding:15px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f0f8ff;
}

/* 2 COLUMNS ONLY */
.col-service{
    width:70%;
    text-align:left;
}

.col-price{
    width:30%;
    font-weight:bold;
    color:#0a3d62;
}

/* BUTTON */
.back-btn{
    display:inline-block;
    margin-top:30px;
    padding:10px 20px;
    background:orange;
    color:white;
    text-decoration:none;
    border-radius:20px;
}
.back-btn:hover{
    background:#ff8800;
}
</style>
</head>

<body>

<header>
    <h1>Our Pricing</h1>
</header>

<section class="pricing-section">

<h2>Transparent & Affordable Pricing</h2>

<table>
    <tr>
        <th class="col-service">Service</th>
        <th class="col-price">Price</th>
    </tr>

    <tr>
        <td class="col-service">Website Development</td>
        <td class="col-price">$200 - $1500</td>
    </tr>

    <tr>
        <td class="col-service">Mobile App Development</td>
        <td class="col-price">$500 - $3000</td>
    </tr>

    <tr>
        <td class="col-service">Cybersecurity Training</td>
        <td class="col-price">$100 - $800</td>
    </tr>

    <tr>
        <td class="col-service">IT Support Services</td>
        <td class="col-price">$50 / month</td>
    </tr>

    <tr>
        <td class="col-service">Cloud Hosting Setup</td>
        <td class="col-price">$150 - $1000</td>
    </tr>

</table>

<a class="back-btn" href="index.html">← Back to Home</a>

</section>

</body>
</html>
